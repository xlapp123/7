<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Interface</title>
    <style>
        /* Enhanced Typography */
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: #333;
        }
        h1, h2, h3 {
            font-weight: 700;
            color: #222;
        }

        /* Improved Spacing */
        .container {
            padding: 20px;
        }

        /* Modern Glassmorphism */
        .card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        /* Optimized Color Hierarchy */
        .primary {
            color: #6200ea;
        }
        .secondary {
            color: #03dac6;
        }

        /* Better Shadows and Depth */
        .shadow {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        /* Smooth Transitions */
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="primary">Welcome to the Phone Interface</h1>
        <div class="card shadow">
            <h2 class="secondary">Card Title</h2>
            <p>This is a card with modern design.</p>
        </div>
    </div>
</body>
</html>
